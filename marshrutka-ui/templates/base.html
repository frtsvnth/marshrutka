<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marshrutka — {% block title %}Окно в конвейеры{% endblock %}</title>
<link rel="icon" type="image/png" href="/static/favicon-96x96.png" sizes="96x96">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="shortcut icon" href="/static/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Marshrutka">
<link rel="manifest" href="/static/site.webmanifest">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-brand">
    <img src="/static/logo.png" alt="Marshrutka" style="width: 100%; max-width: 160px; height: auto; display: block;">
    <div class="subtitle">окно в конвейеры</div>
  </div>
  <nav>
    <a href="/" class="{% if request.url.path == '/' %}active{% endif %}">
      <span class="nav-icon">◈</span><span class="nav-label">Дашборд</span>
    </a>
    <a href="/inbox" class="{% if request.url.path.startswith('/inbox') %}active{% endif %}">
      <span class="nav-icon">⊞</span><span class="nav-label">Инбокс</span>
      {% if pending %}<span class="nav-count">{{ pending }}</span>{% endif %}
    </a>
    <a href="/history" class="{% if request.url.path.startswith('/history') %}active{% endif %}">
      <span class="nav-icon">▤</span><span class="nav-label">История</span>
    </a>
    <a href="/runs/ezhu-ponyatno" class="{% if request.url.path.startswith('/runs') %}active{% endif %}">
      <span class="nav-icon">◷</span><span class="nav-label">Прогоны</span>
    </a>
  </nav>
  <div class="sidebar-footer">Управление — в Hermes</div>
</aside>

<div class="main-wrap">
  <div class="content-area">
    {% if error %}<div class="alert">{{ error }}</div>{% endif %}
    {% if notice %}<div class="notice">{{ notice }}</div>{% endif %}
    {% block content %}{% endblock %}
  </div>
</div>

</body>
</html>
