services:
  ui:
    build: .
    image: marshrutka-ui:latest
    container_name: marshrutka_ui
    ports:
      - "${UI_PORT:-8100}:8100"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
